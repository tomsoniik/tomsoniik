<svg xmlns="http://www.w3.org/2000/svg" width="800" height="280" viewBox="0 0 800 280">
  <defs></defs>
  <style>.t{font:300 92px 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif;fill:#E6EDF3;letter-spacing:4px} .s{font:400 19px Consolas, 'SF Mono', Menlo, 'DejaVu Sans Mono', monospace;fill:#C9D1D9} .dim{fill:#6E7681} .ln{transform-origin:441px 140px;animation:g 1.2s ease-out both} @keyframes g{from{transform:scaleY(0)}to{transform:scaleY(1)}} @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }</style>
  <rect width="800" height="280" fill="#0D1117"/>
  <text x="70" y="168" class="t" textLength="330" lengthAdjust="spacingAndGlyphs">tomson</text>
  <rect x="440" y="80" width="3" height="120" fill="#3399FF" class="ln"/>
  <text x="474" y="112" class="s">full-stack developer</text>
  <text x="474" y="146" class="s">creator of <tspan fill="#3399FF">fraghub</tspan></text>
  <text x="474" y="180" class="s dim">building things 4fun</text>
</svg>
