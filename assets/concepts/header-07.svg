<svg xmlns="http://www.w3.org/2000/svg" width="800" height="280" viewBox="0 0 800 280">
  <defs><linearGradient id="sw" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#3CE0A0" stop-opacity=".05"/><stop offset="1" stop-color="#3CE0A0" stop-opacity=".55"/></linearGradient></defs>
  <style>.t{font:900 78px 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif;fill:#E8FFF4} .s{font:600 17px 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif;fill:#7FD9B0} .lbl{font:700 15px Consolas, 'SF Mono', Menlo, 'DejaVu Sans Mono', monospace;fill:#3CE0A0;letter-spacing:3px} .sw{animation:rot 4s linear infinite} @keyframes rot{to{transform:rotate(360deg)}} .p{animation:pu 2s ease-in-out infinite} .d2{animation-delay:1s} @keyframes pu{50%{opacity:.15}}
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <rect width="800" height="280" fill="#0A1410"/>
  <g transform="translate(620 140)">
    <circle r="110" fill="#0F2A1E" stroke="#3CE0A0" stroke-opacity=".6" stroke-width="2"/>
    <circle r="73" fill="none" stroke="#3CE0A0" stroke-opacity=".3"/><circle r="36" fill="none" stroke="#3CE0A0" stroke-opacity=".3"/>
    <line x1="-110" x2="110" stroke="#3CE0A0" stroke-opacity=".25"/><line y1="-110" y2="110" stroke="#3CE0A0" stroke-opacity=".25"/>
    <g class="sw"><path d="M0 0L110 0A110 110 0 0 0 77.8 -77.8Z" fill="url(#sw)"/></g>
  </g>
  <circle cx="610" cy="100" r="5" fill="#FF4D4D" class="p"/><circle cx="680" cy="170" r="5" fill="#FF4D4D" class="p d2"/><circle cx="575" cy="185" r="5" fill="#3CE0A0"/>
  <text x="50" y="98" class="lbl">◉ ONLINE</text>
  <text x="50" y="180" class="t" textLength="350" lengthAdjust="spacingAndGlyphs">TOMSON</text>
  <text x="50" y="216" class="s" textLength="400" lengthAdjust="spacingAndGlyphs">Full-Stack Developer • Creator of FragHub</text>
</svg>
