  <defs></defs>
  <style>.t{font:800 100px 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif;letter-spacing:6px} .o{fill:none;stroke:#3399FF;stroke-width:1.5} .f{fill:#3399FF} .s{font:400 16px Consolas, 'SF Mono', Menlo, 'DejaVu Sans Mono', monospace;fill:#8B949E} .sw{animation:sw 2.4s ease-in-out .3s forwards} @keyframes sw{to{width:800px}} @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }</style>
