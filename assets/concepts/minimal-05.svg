  <text x="196" y="189" class="s" textLength="296" lengthAdjust="spacingAndGlyphs">full-stack developer, building</text>
  <text x="508" y="189" class="s b" textLength="92" lengthAdjust="spacingAndGlyphs">FragHub</text>
