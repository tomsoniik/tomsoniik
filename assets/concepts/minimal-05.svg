<svg xmlns="http://www.w3.org/2000/svg" width="800" height="280" viewBox="0 0 800 280">
  <defs></defs>
  <style>.t{font:700 88px 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif;fill:#FFFFFF;letter-spacing:2px} .b{fill:#FFFFFF;font-weight:700} .s{font:400 21px 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif;fill:#C9D1D9} .hl{transform-origin:502px 181px;animation:h 1s ease-out .4s both} @keyframes h{from{transform:scaleX(0)}to{transform:scaleX(1)}} @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }</style>
  <rect width="800" height="280" fill="#0D1117"/>
